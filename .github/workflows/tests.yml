name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync

      - name: Install package in editable mode
        run: uv pip install -e ".[agent]"

      - name: Run tests with coverage
        run: uv run pytest -v --tb=short --cov=src.nomos --cov-branch --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage*

      - name: Check coverage enforcement window
        id: window
        if: matrix.python-version == '3.11'
        run: |
          ENFORCE_AFTER="2026-09-11"
          TODAY="$(date +%Y-%m-%d)"
          if [[ "$TODAY" > "$ENFORCE_AFTER" || "$TODAY" == "$ENFORCE_AFTER" ]]; then
            echo "enforced=true" >> "$GITHUB_OUTPUT"
          else
            echo "enforced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Coverage gate (report-only until 2026-09-11, enforced at 90% after)
        if: matrix.python-version == '3.11'
        run: uv run coverage report --fail-under=${{ steps.window.outputs.enforced == 'true' && '90' || '0' }} -m

      - name: Generate coverage XML
        if: matrix.python-version == '3.11'
        run: uv run coverage xml

      - name: Post coverage comment
        if: matrix.python-version == '3.11' && github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          coverage-path: coverage.xml
          minimal-coverage: 0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Check formatting
        run: ruff format --check src/
      - name: Run linter
        run: ruff check src/

  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Lean version manager)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build Lean proofs
        run: |
          cd gov-budget-proof
          lake build

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ty
        run: pip install ty
      - name: Install package
        run: pip install -e .
      - name: Run type checker
        run: ty check src/nomos/benchmarks/ src/nomos/experiments/

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync
      - name: Install package in editable mode
        run: uv pip install -e .
      - name: Run benchmark smoke test
        run: |
          uv run python -m src.nomos.runner all --steps 10 --seeds 1 --strategies governance --csv
          echo "Checking for CSV output..."
          ls -la results/*.csv
          test -f results/*.csv && echo "CSV output found" || echo "No CSV output"
