name: RL Adversary Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rl-adversary-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      # One sync, with the extra, so the RL stack provably lands in the same
      # .venv the steps below execute from. The previous two-step form relied
      # on `uv pip install` discovering that venv, which it does not do when uv
      # is invoked as `python -m uv` — it targeted the hosted interpreter
      # instead, and stable-baselines3 installed successfully into an
      # environment nothing ever ran from.
      - name: Sync dependencies with the RL extra
        run: python -m uv sync --extra rl
      - name: Show where the RL stack actually landed
        run: .venv/bin/python -c "import stable_baselines3, torch; print('sb3', stable_baselines3.__version__, '| torch', torch.__version__)"
      - name: Run a short adversarial protocol (2 modes, 1 seed, 200 steps)
        run: |
          .venv/bin/python -m src.nomos.experiments.rl_adversary protocol \
            --modes governance no_governance \
            --seeds 1 \
            --timesteps 200 \
            --size 6 \
            --eval-episodes 1 \
            --log-dir results/rl_adversary
      - name: Assert the result is finite and sane (schema, not values)
        run: |
          .venv/bin/python -m src.nomos.experiments.rl_validate results/rl_adversary
          test -f results/rl_adversary/adversary_protocol.json && echo "Aggregate found"
          ls -la results/rl_adversary/
      # The frontier harness has more moving parts than the protocol it wraps —
      # a grid, two arms, provenance capture, curve scoring, figures — and a
      # break in any of them would only surface during a multi-hour publication
      # run. This grid exercises every one of those paths in seconds.
      #
      # The epsilons are not arbitrary. H4's plateau is defined over
      # {1.0, 0.99, 0.95}, so a grid missing any of them leaves H4 unevaluable
      # and the smoke would pass while never once running the plateau scoring
      # path it exists to protect. 0.5 is H6's floor. Together they make all
      # four hypotheses return a real verdict.
      - name: Run an epsilon-sweep covering every hypothesis (1 seed, 200 steps)
        run: |
          .venv/bin/python -m src.nomos.experiments.rl_adversary sweep \
            --epsilons 1.0 0.99 0.95 0.5 \
            --arms unshaped shaped \
            --seeds 1 \
            --timesteps 200 \
            --size 6 \
            --eval-episodes 1 \
            --no-controls \
            --log-dir results/rl_frontier
      - name: Assert the frontier is well-formed and pre-registration-backed
        run: |
          .venv/bin/python -m src.nomos.experiments.rl_validate results/rl_frontier
      # A verdict of None is legitimate for a partial sweep, so the validator
      # accepts it — which means the validator alone cannot tell that this smoke
      # actually scored anything. Assert it here instead: every hypothesis must
      # come back with a real boolean, so shrinking the grid later fails loudly
      # rather than quietly hollowing the smoke out.
      - name: Assert the smoke actually scored every hypothesis
        run: |
          .venv/bin/python -c "
          import json, sys
          with open('results/rl_frontier/verifier_frontier.json') as fh:
              verdicts = json.load(fh)['verdicts']
          unevaluated = [h for h in ('h4', 'h5', 'h6', 'h7')
                         if not isinstance(verdicts[h]['pass'], bool)]
          coverage = verdicts['coverage']
          print('coverage:', coverage['measured_points'], '/', coverage['expected_points'])
          print({h: verdicts[h]['pass'] for h in ('h4', 'h5', 'h6', 'h7')})
          if unevaluated:
              sys.exit(f'smoke did not exercise the scoring path for: {unevaluated}')
          if not coverage['complete']:
              sys.exit(f'smoke grid incomplete: {coverage[\"missing\"]}')
          "
      - name: Render the frontier figures
        run: |
          .venv/bin/python -c "
          import json
          from src.nomos.experiments.rl_figures import generate_frontier_figures
          with open('results/rl_frontier/verifier_frontier.json') as fh:
              generate_frontier_figures(json.load(fh), output_dir='results/rl_frontier')
          "
          ls -la results/rl_frontier/
