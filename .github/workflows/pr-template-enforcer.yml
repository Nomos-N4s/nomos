name: PR Template Enforcer

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  contents: read

jobs:
  enforce-template:
    if: github.event.pull_request.user.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR body has required template sections
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const requiredSections = [
              "## Description",
              "## Type of Change",
              "## Checklist",
              "## Testing",
              "## Screenshots / Output",
              "## Additional Notes",
            ];

            const missing = requiredSections.filter(s => !body.includes(s));
            if (missing.length > 0) {
              core.setFailed(
                `PR body is missing required template sections:\n${missing.join("\n")}\n\n` +
                "Please use the PR template at .github/PULL_REQUEST_TEMPLATE.md " +
                "when creating pull requests."
              );
            }
