[project]
name = "governance-layer"
version = "0.1.0"
description = "The Governance Layer: A Formal Framework for Self-Governing AI"
authors = [
    {name = "Carlos Pinto", email = "capintobe@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "neo4j>=5.20",
    "streamlit>=1.35",
    "altair>=5.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas>=2.0",
    "certifi>=2024.0",
    "hypothesis>=6.161",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
rl = [
    "torch>=2.0",
    "stable-baselines3>=2.3",
]
minigrid = [
    "minigrid>=3.1",
    "pygame-ce>=2.4",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
]

[tool.coverage.run]
source = ["src/governance"]
omit = [
    "src/governance/experiments/*",
    "src/governance/benchmarks/*",
    "src/governance/dashboard/*",
    "src/governance/ontology/*",
    "src/governance/tee/*",
    "src/governance/dsl/*",
    "src/governance/prove/*",
    "src/governance/identity/extension.py",
    "src/governance/identity/keys.py",
    "src/governance/identity/ontology.py",
    "src/governance/identity/params.py",
    "src/governance/runner.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["src"]
include = ["governance*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
