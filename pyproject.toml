[project]
name = "governance-layer"
version = "0.1.0"
description = "The Governance Layer: A Formal Framework for Self-Governing AI"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "neo4j>=5.20",
    "streamlit>=1.35",
    "altair>=5.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas>=2.0",
    "certifi>=2024.0",
    "hypothesis>=6.161",
]

[project.optional-dependencies]
rl = [
    "torch>=2.0",
    "stable-baselines3>=2.3",
]

[tool.coverage.run]
source = ["src/governance"]
omit = [
    "src/governance/experiments/*",
    "src/governance/benchmarks/*",
    "src/governance/dashboard/*",
    "src/governance/ontology/*",
    "src/governance/tee/*",
    "src/governance/dsl/*",
    "src/governance/prove/*",
    "src/governance/identity/extension.py",
    "src/governance/identity/keys.py",
    "src/governance/identity/ontology.py",
    "src/governance/identity/params.py",
    "src/governance/runner.py",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["governance*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
