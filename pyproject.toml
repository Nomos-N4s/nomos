[project]
name = "nomos"
version = "0.13.0"
description = "Nomos: A Formal Framework for Self-Governing AI"
license = "Apache-2.0"
authors = [
    {name = "Carlos Pinto", email = "capintobe@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "neo4j>=5.20",
    "streamlit>=1.35",
    "altair>=5.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "certifi>=2024.0",
    "hypothesis>=6.161",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
agent = [
    "pydantic-ai-slim[openrouter]>=2.21",
]
dashboard = [
    "streamlit-autorefresh>=1.0",
]
rl = [
    "torch>=2.0",
    "stable-baselines3>=2.3",
]
minigrid = [
    "minigrid>=3.1",
    "pygame-ce>=2.4",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
]
types = [
    "ty>=0.0.64",
]
observability = [
    "prometheus-client>=0.20",
]

[tool.coverage.run]
source = ["src/nomos"]
relative_files = true
omit = [
    "src/nomos/experiments/*",
    "src/nomos/benchmarks/*",
    "src/nomos/dashboard/*",
    "src/nomos/ontology/*",
    "src/nomos/tee/*",
    "src/nomos/prove/*",
    "src/nomos/identity/extension.py",
    "src/nomos/identity/keys.py",
    "src/nomos/identity/ontology.py",
    "src/nomos/identity/params.py",
    "src/nomos/runner.py",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (excluded from quick local runs, included in CI).",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
unresolved-import = "warn"
unresolved-attribute = "warn"
unsupported-operator = "warn"
invalid-parameter-default = "error"

[tool.ty.src]
include = ["src/nomos/benchmarks", "src/nomos/experiments", "src/nomos/dsl", "src/nomos/agents"]
exclude = [
    "src/nomos/experiments/minigrid_wrapper.py",
    "src/nomos/experiments/safety_gym_wrapper.py",
    "src/nomos/experiments/safety_grid_world.py",
    "src/nomos/experiments/gym_env.py",
    "src/nomos/experiments/rl_train.py",
    "src/nomos/experiments/rl_adversary.py",
    "src/nomos/agents/pydantic_adapter.py",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nomos*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
